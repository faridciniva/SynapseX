<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LTX — The world model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
::selection{background:rgba(255,255,255,.2)}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
:root{
  --ease:cubic-bezier(.22,1,.36,1);
  --slow:cubic-bezier(.65,0,.35,1);
}
html,body{width:100%;height:100%;background:#000;color:#fff;font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.stage{position:relative;isolation:isolate;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#000}

/* ── Media ── */
.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0;pointer-events:none;visibility:hidden}
.media.active{visibility:visible}

/* ── Hero ── */
.hero{position:absolute;inset:0;z-index:10;pointer-events:none}
.hero h1{
  position:absolute;top:35.9%;left:50%;transform:translateX(-50%);
  width:min(901px,calc(100vw - 48px));
  font-size:clamp(62px,6.8vw,100px);font-weight:500;line-height:.8;
  letter-spacing:-.04em;white-space:nowrap;
  text-shadow:0 2px 12px rgb(0 0 0/.14);
}
.hero h1 span{
  display:inline-block;
  transition:opacity 900ms var(--ease),filter 900ms var(--ease),transform 900ms var(--ease);
}
.hero h1 span:nth-child(1){transition-delay:0ms}
.hero h1 span:nth-child(2){transition-delay:90ms}
.hero h1 span:nth-child(3){transition-delay:180ms}
.stage.title-hidden .hero h1 span{opacity:0;filter:blur(12px);transform:translateY(-10px)}
.hero p{
  position:absolute;top:calc(46.78% + 94px);left:50%;transform:translateX(-50%);
  width:min(734px,calc(100vw - 48px));
  font-size:clamp(14px,1.25vw,18px);font-weight:400;line-height:1.2;letter-spacing:-.04em;
  text-shadow:0 1px 8px rgb(0 0 0/.16);
}

/* ── Controller ── */
.controller{
  position:absolute;top:46.78%;left:50%;transform:translateX(-50%);
  width:min(880px,calc(100vw - 48px));height:72px;z-index:20;
}
.track{
  position:absolute;top:4px;left:0;width:100%;height:64px;
  border-radius:999px;overflow:hidden;
  background:rgb(24 55 82/.31);
  border:1px solid rgb(255 255 255/.2);
  backdrop-filter:blur(9px) saturate(126%) contrast(108%) brightness(103%);
  -webkit-backdrop-filter:blur(9px) saturate(126%) contrast(108%) brightness(103%);
  box-shadow:0 14px 38px rgb(4 24 43/.16),0 2px 7px rgb(4 24 43/.1),
    inset 1px 1px 0 rgb(255 255 255/.48),inset -1px -1px 0 rgb(21 49 73/.14),
    inset 0 0 0 .5px rgb(255 255 255/.16);
  transition:opacity 400ms linear,left 980ms var(--slow),width 980ms var(--slow);
}
.track::before{
  content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(120% 150% at var(--gx,24%) var(--gy,8%),rgb(255 255 255/.25),transparent 53%),
    linear-gradient(115deg,rgb(255 255 255/.10),transparent 42%);
}
.track::after{
  content:'';position:absolute;inset:-1px;padding:1px;pointer-events:none;border-radius:inherit;
  background:conic-gradient(from 225deg,#7fe3ff,rgb(255 255 255/.35),#fff,#ffd7e6,rgb(255 255 255/.35),#7fe3ff);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:.27;
}
.capsule{
  position:absolute;top:-1px;
  left:var(--cap-l,-5px);width:var(--cap-w,calc(20% + 5px));
  height:72px;border-radius:999px;overflow:hidden;
  background:rgb(246 251 255/.24);
  border:1px solid rgb(255 255 255/.28);
  backdrop-filter:blur(13px) saturate(128%) contrast(107%) brightness(105%);
  -webkit-backdrop-filter:blur(13px) saturate(128%) contrast(107%) brightness(105%);
  box-shadow:0 11px 28px rgb(4 24 43/.17),0 2px 6px rgb(4 24 43/.1),
    inset 1px 1px 0 rgb(255 255 255/.62),inset -1px -1px 0 rgb(20 49 73/.18),
    inset 0 0 12px rgb(255 255 255/.055);
  transition:left 620ms var(--ease),width 620ms var(--ease),background 300ms ease;
  z-index:1;
}
.capsule::before{
  content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(120% 150% at var(--gx,24%) var(--gy,8%),rgb(255 255 255/.25),transparent 53%),
    linear-gradient(115deg,rgb(255 255 255/.10),transparent 42%);
}
.capsule::after{
  content:'';position:absolute;inset:-1px;padding:1px;pointer-events:none;border-radius:inherit;
  background:conic-gradient(from 225deg,#7fe3ff,rgb(255 255 255/.35),#fff,#ffd7e6,rgb(255 255 255/.35),#7fe3ff);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:.30;
}
.cells{
  position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);
  align-items:center;z-index:2;
}
.cell{
  display:flex;align-items:center;justify-content:center;
  height:100%;padding:0 14px;
  font-family:'Manrope',system-ui,sans-serif;font-size:23px;font-weight:400;
  line-height:1.2;letter-spacing:-.04em;white-space:nowrap;color:#fff;
  transition:opacity 420ms var(--ease),filter 420ms var(--ease),transform 980ms var(--slow);
}
button.cell{background:transparent;border:0;border-radius:999px;cursor:pointer}
button.cell:disabled{cursor:default}

/* Collapsed */
.controller.collapsed .capsule{
  left:calc(50% - 100px);width:200px;
  background:rgb(246 251 255/.14);
  transition:left 980ms var(--slow),width 980ms var(--slow),background 300ms ease;
}
.controller.collapsed .track{
  left:calc(50% - 96px);width:192px;
  opacity:0;
  transition:opacity 400ms linear 650ms,left 980ms var(--slow),width 980ms var(--slow);
}
.controller.collapsed .cell:not(.sel){
  opacity:0;filter:blur(10px);transform:scale(.94);pointer-events:none;
}
.controller.hovering .lbl{opacity:.5;transition:opacity 300ms}

/* Reset reveal */
@keyframes rReveal{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:blur(0)}}
.reset-lbl{animation:rReveal 520ms var(--ease) forwards;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* Header */
header{
  position:absolute;top:0;left:0;right:0;z-index:30;
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;
  padding:calc(58px + env(safe-area-inset-top)) 40px 40px;
  text-shadow:0 1px 6px rgb(0 0 0/.18);
}
.logo-link{display:flex;align-items:center}
.logo-link svg{height:24px;width:auto;display:block}
.meta{
  display:flex;align-items:center;
  margin-left:clamp(48px,5vw,70px);gap:clamp(28px,3vw,44px);
  font-size:18px;line-height:1.2;letter-spacing:-.04em;
}
.try-now{
  display:flex;align-items:center;justify-content:center;
  width:152px;height:38px;border-radius:999px;
  border:1px solid rgb(255 255 255/.75);background:transparent;
  color:#fff;font-family:'Manrope',system-ui,sans-serif;font-size:18px;
  text-decoration:none;transition:color 300ms,background 300ms,border-color 300ms;
}
.try-now:hover,.try-now:focus-visible{background:#fff;color:#0b1a26;border-color:#fff}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ── Responsive ── */
@media(max-width:900px){
  header{padding:calc(24px + env(safe-area-inset-top)) 24px 24px}
  .meta{font-size:14px;gap:22px;margin-left:34px}
  .try-now{width:116px;height:36px;font-size:14px}
  .cell{font-size:clamp(17px,2.5vw,24px)}
}
@media(max-width:700px){
  header{padding-left:18px;padding-right:18px}
  .logo-link svg{height:21px}
  .meta{font-size:12px}
  .smarter{display:none}
  .try-now{position:relative;width:92px;height:34px;font-size:13px}
  .try-now::after{content:'';position:absolute;inset:-6px -10px}
  .hero h1{top:34%;width:calc(100vw - 40px);font-size:clamp(48px,14vw,64px);line-height:.88;white-space:normal}
  .hero p{top:77%;width:calc(100vw - 44px);font-size:14px}
  .controller{top:53%;width:calc(100vw - 40px);height:156px}
  .track{top:0;height:156px;border-radius:28px}
  .cells{grid-template-columns:1fr 1fr;grid-template-rows:48px 54px 54px}
  .lbl{grid-column:1/-1;font-size:17px}
  .cell{font-size:17px}
  .capsule{opacity:0;pointer-events:none}
  .controller.collapsed .capsule,.controller.selected .capsule{
    opacity:1;left:50%;top:4dvh;transform:translate(-50%,-50%);
    width:196px;height:64px;background:rgb(246 251 255/.18);
  }
}
@media(max-width:700px) and (max-height:700px){
  .controller{top:50%}
  .hero p{top:calc(50% + 168px);width:calc(100vw - 32px);font-size:13px}
}
@media(max-height:520px) and (orientation:landscape){
  .hero h1{top:20%;font-size:clamp(34px,8vh,56px)}
  .controller{top:50%}
  .hero p{top:auto;bottom:8px;font-size:13px}
}
@media(max-width:700px) and (max-height:520px) and (orientation:landscape){
  .hero h1{top:12%;font-size:clamp(28px,7vh,44px)}
  .controller{top:46%;height:118px}
  .track{height:118px}
  .cells{grid-template-rows:36px 41px 41px}
  .cell{font-size:15px}
  .hero p{bottom:6px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  .capsule,.track,.cell,.hero h1 span,.try-now{transition-duration:1ms!important;transition-delay:0ms!important}
  .hero h1 span{filter:none!important}
}
</style>
</head>
<body>
<div class="stage" id="stage">

<!-- 8 videos — one per clip, no src swap ever -->
<video id="v1f" class="media active" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1.mp4"         muted playsinline preload="auto" aria-hidden="true"></video>
<video id="v1r" class="media"        src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1-reverse.mp4"  muted playsinline preload="auto" aria-hidden="true"></video>
<video id="v2f" class="media"        src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2.mp4"         muted playsinline preload="auto" aria-hidden="true"></video>
<video id="v2r" class="media"        src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2-reverse.mp4"  muted playsinline preload="auto" aria-hidden="true"></video>
<video id="v3f" class="media"        src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3.mp4"         muted playsinline preload="auto" aria-hidden="true"></video>
<video id="v3r" class="media"        src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3-reverse.mp4"  muted playsinline preload="auto" aria-hidden="true"></video>
<video id="v4f" class="media"        src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4.mp4"         muted playsinline preload="auto" aria-hidden="true"></video>
<video id="v4r" class="media"        src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4-reverse.mp4"  muted playsinline preload="auto" aria-hidden="true"></video>

<!-- Hero copy -->
<div class="hero">
  <h1><span>The</span>&nbsp;<span>world</span>&nbsp;<span>model</span></h1>
  <p>LTX builds open world models that give you full control, from production-grade video to systems that understand and operate in the physical world.</p>

<!-- Controller -->
<div class="controller" id="ctrl" role="group" aria-label="Scene state controller">
  <div class="track" id="track"></div>
  <div class="capsule" id="capsule"></div>
  <div class="cells">
    <div class="cell lbl" id="lbl">Select&nbsp;state&nbsp;→</div>
    <button class="cell" data-idx="1" data-fwd="v2f" data-rev="v2r" data-fd="2.08" data-rd="2.08" data-fh="0.08" data-rh="0.18">Scene</button>
    <button class="cell" data-idx="2" data-fwd="v3f" data-rev="v3r" data-fd="2.08" data-rd="2.04" data-fh="0.08" data-rh="0.08">Lighting</button>
    <button class="cell" data-idx="3" data-fwd="v1f" data-rev="v1r" data-fd="2.08" data-rd="2.08" data-fh="0.08" data-rh="0.08">Clothing</button>
    <button class="cell" data-idx="4" data-fwd="v4f" data-rev="v4r" data-fd="3.00" data-rd="2.48" data-fh="0.08" data-rh="0.08">Cast</button>
  </div>
</div>

<!-- Header -->
<header>
  <a href="https://ltx.ai/" class="logo-link" aria-label="LTX home">
    <svg viewBox="0 0 75 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none">
      <path d="M2 2V30H16"             stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 2H44M33 2V30"       stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M51 2L73 30M51 30L73 2" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </a>
  <div class="meta">
    <span>LTX-2.5 is here</span>
    <span class="smarter">Smarter. Faster</span>
  </div>
  <a href="https://app.ltx.io/" target="_blank" rel="noopener noreferrer" class="try-now">Try now</a>
</header>

<div id="status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</div>

<script>
(function(){
'use strict';

var BASE = 'https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/';

var stage   = document.getElementById('stage');
var ctrl    = document.getElementById('ctrl');
var capsule = document.getElementById('capsule');
var track   = document.getElementById('track');
var lbl     = document.getElementById('lbl');
var statusEl= document.getElementById('status');

var vids = {};
['v1f','v1r','v2f','v2r','v3f','v3r','v4f','v4r'].forEach(function(id){
  vids[id] = document.getElementById(id);
});

var btns = Array.from(ctrl.querySelectorAll('button.cell'));

// CAP positions: index 0 = label, 1-4 = buttons
var CAPS = [
  {l:'-5px',       w:'calc(20% + 5px)'},
  {l:'20%',        w:'20%'},
  {l:'40%',        w:'20%'},
  {l:'60%',        w:'20%'},
  {l:'80%',        w:'calc(20% + 5px)'},
];

// State
var locked   = false;
var tok      = 0;
var scene    = 'base';
var visId    = 'v1f';
var hoverIdx = null;
var focusIdx = null;

function setCapPos(idx){
  ctrl.style.setProperty('--cap-l', CAPS[idx].l);
  ctrl.style.setProperty('--cap-w', CAPS[idx].w);
}

function announce(msg){
  statusEl.textContent='';
  setTimeout(function(){ statusEl.textContent=msg; },10);
}

function showVid(newId){
  if(visId && visId!==newId) vids[visId].classList.remove('active');
  vids[newId].classList.add('active');
  visId=newId;
}

function hideTitle(){ stage.classList.add('title-hidden'); }
function showTitle(){ stage.classList.remove('title-hidden'); }

function disableAll(){
  btns.forEach(function(b){ b.disabled=true; b.setAttribute('tabindex','-1'); b.setAttribute('aria-hidden','true'); });
}
function enableAll(){
  btns.forEach(function(b){ b.disabled=false; b.setAttribute('tabindex','0'); b.removeAttribute('aria-hidden'); });
}

// Park base video
var base = vids.v1f;
if(base.readyState>=2){ base.pause(); base.currentTime=0; }
else base.addEventListener('loadeddata',function(){ base.pause(); base.currentTime=0; },{once:true});

// Track readiness per button
btns.forEach(function(b){
  b.disabled=true; b.setAttribute('aria-disabled','true');
  var fwdReady=false, revReady=false;
  function check(){ if(fwdReady&&revReady){ b.disabled=false; b.removeAttribute('aria-disabled'); } }
  function watch(id,setter){
    var v=vids[id];
    if(v.readyState>=2){ setter(); check(); }
    else v.addEventListener('loadeddata',function(){ setter(); check(); },{once:true});
  }
  watch(b.dataset.fwd, function(){ fwdReady=true; });
  watch(b.dataset.rev, function(){ revReady=true; });
});

// Glass pointer
ctrl.addEventListener('pointermove',function(e){
  var r=ctrl.getBoundingClientRect();
  ctrl.style.setProperty('--gx', ((e.clientX-r.left)/r.width*100).toFixed(1)+'%');
  ctrl.style.setProperty('--gy', ((e.clientY-r.top)/r.height*100).toFixed(1)+'%');
});

// Hover / focus capsule tracking
btns.forEach(function(b,i){
  var idx=i+1;
  b.addEventListener('mouseenter',function(){
    if(locked)return;
    hoverIdx=idx; ctrl.classList.add('hovering'); setCapPos(idx);
  });
  b.addEventListener('mouseleave',function(){
    if(locked)return;
    hoverIdx=null; ctrl.classList.remove('hovering');
    setCapPos(focusIdx!==null?focusIdx:0);
  });
  b.addEventListener('focus',function(){
    if(locked)return;
    focusIdx=idx; ctrl.classList.add('hovering'); setCapPos(idx);
  });
  b.addEventListener('blur',function(){
    if(locked)return;
    if(focusIdx===idx){ focusIdx=null; ctrl.classList.remove('hovering'); setCapPos(hoverIdx!==null?hoverIdx:0); }
  });
});

// First-frame promise
function firstFrame(v, myTok, ms){
  return new Promise(function(res,rej){
    var dead=null, hidden=false, done=false;
    function finish(){ if(done)return; done=true; clearTimeout(dead); document.removeEventListener('visibilitychange',onVis); res(); }
    function fail(msg){ if(done)return; done=true; clearTimeout(dead); document.removeEventListener('visibilitychange',onVis); rej(new Error(msg)); }
    function startTimer(){ dead=setTimeout(function(){ fail('timeout'); },ms||12000); }
    function onVis(){
      if(document.hidden){ clearTimeout(dead); hidden=true; v.pause(); v.currentTime=0; }
      else { hidden=false; startTimer(); v.play().catch(function(){}); }
    }
    document.addEventListener('visibilitychange',onVis);
    if('requestVideoFrameCallback' in HTMLVideoElement.prototype){
      function check(now,meta){
        if(tok!==myTok){finish();return;}
        if(meta.mediaTime<=0.5&&v.readyState>=2){ finish(); }
        else { v.requestVideoFrameCallback(check); }
      }
      v.requestVideoFrameCallback(check);
    } else {
      function tryFallback(){
        if(tok!==myTok){finish();return;}
        if(v.readyState>=2){ requestAnimationFrame(function(){ requestAnimationFrame(finish); }); }
        else setTimeout(tryFallback,50);
      }
      v.addEventListener('playing',tryFallback,{once:true});
    }
    startTimer();
  });
}

// Hold monitor
function holdAt(v, dur, guard, myTok, cb){
  var target=dur-guard;
  function cleanup(){ v.removeEventListener('timeupdate',onT); v.removeEventListener('ended',onE); }
  function onT(){ if(tok!==myTok){cleanup();return;} if(v.currentTime>=target){cleanup();v.pause();cb();} }
  function onE(){ if(tok!==myTok){cleanup();return;} cleanup(); cb(); }
  v.addEventListener('timeupdate',onT);
  v.addEventListener('ended',onE);
}

// Rewind utility
function rewind(v){
  if(v.currentTime>0.001){
    v.currentTime=0;
    return new Promise(function(r){ v.addEventListener('seeked',function(){r();},{once:true}); });
  }
  return Promise.resolve();
}

// ── FORWARD ──
function goForward(btn){
  if(locked||scene!=='base')return;
  locked=true; tok++; var myTok=tok;
  disableAll();
  ctrl.classList.remove('hovering');

  var fwdId=btn.dataset.fwd, revId=btn.dataset.rev;
  var fd=+btn.dataset.fd, rd=+btn.dataset.rd;
  var fh=+btn.dataset.fh, rh=+btn.dataset.rh;
  var origText=btn.textContent;
  var hadFocus=(document.activeElement===btn);
  var isBase=(fwdId==='v1f');

  announce('Loading…');

  // Collapse
  btn.classList.add('sel');
  ctrl.classList.add('collapsed');

  // Move sel label toward future capsule center
  requestAnimationFrame(function(){
    if(tok!==myTok)return;
    var cr=capsule.getBoundingClientRect(), br=btn.getBoundingClientRect();
    var dx=(cr.left+cr.width/2)-(br.left+br.width/2);
    var dy=(cr.top +cr.height/2)-(br.top +br.height/2);
    btn.style.transition='transform 980ms var(--slow)';
    btn.style.transform='translate('+dx+'px,'+dy+'px)';
  });

  // Hide title at 12%
  var titleT=setTimeout(hideTitle, Math.min(fd*0.12,0.9)*1000);

  function onError(e){
    if(tok!==myTok)return;
    console.error(e); clearTimeout(titleT); showTitle();
    ctrl.classList.remove('collapsed'); btn.classList.remove('sel');
    btn.style.transform=''; btn.style.transition='';
    locked=false; tok++; enableAll(); announce('Error. Please try again.');
  }

  var fv=vids[fwdId];
  var p;
  if(isBase){
    p=fv.play().then(function(){ return Promise.resolve(); });
  } else {
    p=rewind(fv).then(function(){
      if(tok!==myTok)return;
      var fp=firstFrame(fv,myTok,12000);
      var pp=fv.play();
      return Promise.all([pp,fp]);
    });
  }

  p.then(function(){
    if(tok!==myTok)return;
    if(!isBase) showVid(fwdId);
    holdAt(fv,fd,fh,myTok,function(){
      if(tok!==myTok)return;
      scene=btn.dataset.fwd;
      // Show reset
      btn.innerHTML='<span class="reset-lbl">Reset</span>';
      btn.setAttribute('aria-label','Reset to base');
      btn.disabled=false; btn.setAttribute('tabindex','0'); btn.removeAttribute('aria-hidden');
      btn._orig=origText; btn._revId=revId; btn._rd=rd; btn._rh=rh; btn._hadFocus=hadFocus;
      if(hadFocus) btn.focus({preventScroll:true});
      announce('Selected. Click Reset to go back.');
    });
  }).catch(onError);
}

// ── REVERSE ──
function goReverse(btn){
  tok++; var myTok=tok;
  btn.disabled=true; btn.setAttribute('tabindex','-1');

  var revId=btn._revId, rd=btn._rd, rh=btn._rh, hadFocus=btn._hadFocus, orig=btn._orig;
  announce('Returning to base…');

  var rv=vids[revId];

  // Start expand + play in parallel
  setCapPos(0);
  ctrl.classList.remove('collapsed');
  btn.style.opacity='0'; btn.style.transition='opacity 300ms';

  rewind(rv).then(function(){
    if(tok!==myTok)return;
    var fp=firstFrame(rv,myTok,12000);
    var pp=rv.play();
    return Promise.all([pp,fp]);
  }).then(function(){
    if(tok!==myTok)return;
    showVid(revId);
    holdAt(rv,rd,rh,myTok,function(){
      if(tok!==myTok)return;
      showVid('v1f');
      base.currentTime=0;
      // Restore button
      btn.classList.remove('sel');
      btn.style.transform=''; btn.style.transition=''; btn.style.opacity='';
      btn.innerHTML=''; btn.textContent=orig;
      btn.removeAttribute('aria-label');
      showTitle();
      scene='base'; locked=false; tok++;
      enableAll();
      if(hadFocus) btn.focus({preventScroll:true});
      announce('Returned to base.');
    });
  }).catch(function(e){
    console.error(e);
    showVid('v1f'); base.currentTime=0;
    btn.classList.remove('sel'); btn.style.transform=''; btn.style.transition=''; btn.style.opacity='';
    btn.textContent=orig; btn.removeAttribute('aria-label');
    showTitle(); scene='base'; locked=false; tok++; enableAll();
    announce('Error. Returned to base.');
  });
}

// Click handlers
btns.forEach(function(btn){
  btn.addEventListener('click',function(){
    // Reset (reverse) always allowed even when locked (selected state)
    if(btn.querySelector('.reset-lbl')){ goReverse(btn); return; }
    if(locked||scene!=='base')return;
    goForward(btn);
  });
});

// Init capsule
setCapPos(0);

// ── postMessage: cursor simulation + auto-cycle from parent page ──────────
window.addEventListener('message',function(e){
  if(!e.data||!e.data.type)return;
  // Move glass capsule to hovered button (0=Scene,1=Lighting,2=Clothing,3=Cast)
  if(e.data.type==='ltx-hover'&&typeof e.data.idx==='number'){
    if(locked)return;
    setCapPos(e.data.idx+1);
    lbl.style.opacity='0.5';
    lbl.style.transition='opacity 300ms';
  }
  // Return capsule to label position on unhover
  if(e.data.type==='ltx-unhover'){
    if(locked)return;
    setCapPos(0);
    lbl.style.opacity='';
    lbl.style.transition='';
  }
  // Auto-click a button by index
  if(e.data.type==='ltx-click'&&typeof e.data.idx==='number'){
    var btn=btns[e.data.idx];
    if(btn&&!btn.disabled&&!locked&&scene==='base') btn.click();
  }
  // Auto-reset: click the active Reset button (works even with locked=true in selected state)
  if(e.data.type==='ltx-reset'){
    var rb=ctrl.querySelector('button.sel');
    if(rb&&!rb.disabled) rb.click();
  }
});

})();
</script>
